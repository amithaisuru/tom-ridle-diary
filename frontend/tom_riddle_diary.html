<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Riddle's Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Diary Sinhala";
    src: url("fonts/tharu_digital_nidahasa.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 42%, #2b1d12 0%, #140d08 55%, #060403 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  #book {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    width: min(96vw, calc(92vh * 3436 / 2576));
    aspect-ratio: 3436 / 2576;
    isolation: isolate;
    perspective: 2200px;
    border-radius: 5px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .75), 0 0 0 5px #28190f, 0 0 0 6px #4a3020;
  }
  #book::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%; width: 4%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(44, 25, 12, .24) 42%, rgba(35, 19, 9, .6) 50%, rgba(44, 25, 12, .22) 58%, transparent);
    pointer-events: none;
    z-index: 2;
  }
  body:has(.book-intro) { overflow: hidden; }
  #book.book-intro {
    transform: translateX(calc(-25% + var(--intro-offset, 0px))) rotateZ(-2deg);
    box-shadow: none;
  }
  #book.book-intro > .paper { visibility: hidden; }
  #book.book-intro::after { opacity: 0; }
  #diary-cover {
    position: absolute;
    inset: 0 0 0 50%;
    z-index: 5;
    transform-origin: left center;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  #diary-cover[hidden] { display: none; }
  .cover-face {
    position: absolute;
    inset: 0;
    border-radius: 3px 9px 9px 3px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .cover-front {
    container-type: inline-size;
    background: linear-gradient(100deg, rgba(0, 0, 0, .6), transparent 12%, rgba(0, 0, 0, .08) 70%, rgba(0, 0, 0, .4)), url("leather-grain.svg") repeat;
    background-color: #24211d;
    border: 1px solid #4f4639;
    box-shadow: inset 0 0 0 3px #302b24, inset -7px 0 9px rgba(0, 0, 0, .7), inset 7px 0 12px rgba(0, 0, 0, .7), 4px 6px 0 -1px #baaa83, 6px 10px 0 -2px #211a12, 15px 25px 50px rgba(0, 0, 0, .65);
    transform: translateZ(2px);
  }
  .cover-front::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 7%;
    background: linear-gradient(90deg, #0d0c0a, rgba(99, 82, 59, .22) 50%, transparent);
    border-right: 1px solid rgba(0, 0, 0, .35);
  }
  .cover-front::after {
    content: "";
    position: absolute; inset: 2.5%;
    border: 1px dashed rgba(157, 131, 85, .28);
    border-radius: 3px 6px 6px 3px;
  }
  #diary-cover .cover-back {
    position: absolute;
    transform: rotateY(180deg);
    box-shadow: inset -12px 0 30px -18px rgba(70, 40, 15, .45);
  }
  .cover-corner {
    position: absolute;
    width: 17%; height: auto;
    color: #5f4a30;
    filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, .65));
    z-index: 1;
  }
  .corner-tl { top: 0; left: 0; }
  .corner-tr { top: 0; right: 0; transform: rotate(90deg); }
  .corner-br { bottom: 0; right: 0; transform: rotate(180deg); }
  .corner-bl { bottom: 0; left: 0; transform: rotate(270deg); }
  .cover-nameplate {
    position: absolute; left: 15%; right: 12%; bottom: 17%;
    padding: .8em .4em;
    border: 1px solid #806943;
    outline: 4px solid rgba(11, 10, 8, .65);
    background: linear-gradient(100deg, #171510, #27231a 55%, #18150f);
    box-shadow: 0 4px 8px rgba(0, 0, 0, .55), inset 0 0 0 3px #211c14, inset 0 0 0 4px rgba(177, 143, 77, .3);
    color: #c8a761;
    font-size: clamp(10px, 4.2cqw, 25px);
    font-weight: bold;
    letter-spacing: .08em;
    text-align: center;
    text-shadow: 0 1px #080704, 0 -1px rgba(231, 199, 130, .25);
  }
  .diary-button {
    padding: .6em .9em;
    border: 1px solid rgba(190, 159, 111, .3);
    border-radius: 3px;
    background: rgba(25, 17, 10, .8);
    color: #c0a580;
    font: italic 12px Georgia, serif;
    cursor: pointer;
    z-index: 10;
  }
  .diary-button:hover, .diary-button:focus-visible { color: #efdab9; border-color: #a08255; }
  .diary-button:disabled { opacity: .65; cursor: wait; }
  #diary-controls {
    position: fixed; top: 18px; right: 22px;
    display: flex; gap: 10px;
    z-index: 10;
  }
  .diary-button.icon-button {
    display: inline-grid;
    place-items: center;
    width: 44px; height: 44px;
    padding: 0;
    border: 1px solid #957b4b;
    border-radius: 7px;
    background: linear-gradient(145deg, #463824, #211a12 70%);
    box-shadow: inset 0 0 0 2px #231b12, inset 0 0 0 3px rgba(177, 143, 77, .3), 0 3px 10px rgba(0, 0, 0, .4);
    color: #cfaf72;
  }
  .icon-button[hidden] { display: none; }
  .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icon-button:hover { filter: brightness(1.2); }
  .icon-button:focus-visible { outline: 2px solid #cfaf72; outline-offset: 3px; }
  .mute-slash, .is-muted .sound-waves { display: none; }
  .is-muted .mute-slash { display: block; }
  #open-diary {
    position: absolute; left: 50%; bottom: 7%;
    transform: translateX(-50%);
    pointer-events: auto;
    font-size: clamp(12px, 3.2cqw, 18px);
    white-space: nowrap;
  }
  #book.book-intro.is-opening { animation: book-settle 1400ms cubic-bezier(.42, 0, .18, 1) both; }
  #book.book-intro:is(.is-opening, .is-closing) > .paper { visibility: visible; }
  #book.is-opening #page { animation: page-uncover 1400ms both; }
  #book.is-opening::after { animation: page-uncover 1400ms both; }
  #book.is-opening #diary-cover { animation: cover-opening 1400ms cubic-bezier(.42, 0, .18, 1) both; }
  #book.book-intro.is-closing { animation: book-settle 900ms cubic-bezier(.42, 0, .18, 1) reverse both; }
  #book.is-closing #page, #book.is-closing::after { animation: page-uncover 900ms reverse both; }
  #book.is-closing #diary-cover { animation: cover-opening 900ms cubic-bezier(.42, 0, .18, 1) reverse both; }
  @keyframes book-settle {
    from { transform: translateX(calc(-25% + var(--intro-offset, 0px))) rotateZ(-2deg); box-shadow: none; }
    to { transform: translateX(0) rotateZ(0); box-shadow: 0 30px 80px rgba(0, 0, 0, .75), 0 0 0 5px #28190f, 0 0 0 6px #4a3020; }
  }
  @keyframes cover-opening {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(-180deg); }
  }
  @keyframes page-uncover {
    0%, 45% { opacity: 0; }
    85%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #book.book-intro:is(.is-opening, .is-closing), #book:is(.is-opening, .is-closing) #page,
    #book:is(.is-opening, .is-closing)::after, #book:is(.is-opening, .is-closing) #diary-cover { animation: none; }
  }

  #page {
    cursor: none;
  }
  #history-page {
    display: flex;
    flex-direction: column;
    padding: 10% 10% 8%;
    box-sizing: border-box;
    border-radius: 2px 5px 5px 2px;
    color: #392619;
    container-type: inline-size;
    box-shadow: inset -14px 0 30px -18px rgba(70, 40, 15, .45);
  }
  .history-heading { flex-shrink: 0; text-align: center; }
  .history-kicker {
    margin: 0 0 .65em;
    font-size: clamp(8px, 2.4cqw, 11px);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #795a3d;
  }
  #history-title {
    margin: 0;
    font-family: "Moon Dance", cursive;
    font-size: clamp(24px, 10cqw, 44px);
    font-weight: 400;
  }
  .history-heading::after {
    content: "❦";
    display: block;
    margin: .65em auto;
    color: #866544;
    font-size: 18px;
  }
  #history-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(111, 76, 43, .4) transparent;
    padding: 0 4% 4% 1%;
    outline-offset: 3px;
  }
  #history-scroll:focus-visible { outline: 1px solid #795a3d; }
  #history-empty {
    margin: 22% 0 0;
    font-size: clamp(12px, 4cqw, 17px);
    font-style: italic;
    line-height: 1.9;
    text-align: center;
    color: #795a3d;
  }
  #history-list { margin: 0; padding: 0; list-style: none; }
  .history-entry {
    display: flex;
    flex-direction: column;
    gap: .65em;
    padding: .75em 0;
  }
  .history-entry:first-child { padding-top: .25em; }
  .history-text {
    max-width: 90%;
    box-sizing: border-box;
    margin: 0;
    padding: .4em .7em;
    border: 1px solid rgba(111, 76, 43, .2);
    box-shadow: 0 2px 5px rgba(70, 40, 15, .06), inset 0 1px rgba(255, 244, 216, .35);
    font-family: "Moon Dance", cursive;
    font-size: clamp(17px, 6cqw, 25px);
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .history-question {
    align-self: flex-end;
    border-radius: 12px 12px 3px 12px;
    background: rgba(159, 113, 60, .16);
  }
  .sinhala-display { font-family: "Diary Sinhala", serif; }
  .sinhala-display::before { content: attr(data-legacy); }
  .screen-reader-text {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .history-answer {
    align-self: flex-start;
    border-radius: 12px 12px 12px 3px;
    background: rgba(255, 240, 207, .35);
    color: #24180f;
  }
  @media (max-width: 600px) {
    body { overflow: auto; justify-content: flex-start; padding: 12px; box-sizing: border-box; }
    #book { flex-shrink: 0; width: 640px; --intro-offset: calc((100vw - 640px) / 2 - 12px); }
  }
  /* multiply makes the ink sit *in* the paper rather than on top of it */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
  textarea {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; margin: 0; resize: none; outline: none;
    font-size: 16px; color: transparent; background: transparent; caret-color: transparent;
    cursor: none;
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 4%;
    text-align: center; font-size: clamp(11px, 1.6vh, 14px); letter-spacing: .05em;
    color: rgba(85, 52, 26, .6); pointer-events: none; transition: opacity 1.2s ease;
  }
</style>

  </div>
  </main>
  <nav id="diary-controls" aria-label="Diary controls">
    <button id="diary-toggle" class="diary-button icon-button" type="button" aria-label="Close diary" title="Close diary" aria-controls="book" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" opacity=".5"/></svg>
    </button>
    <button id="music-toggle" class="diary-button icon-button" type="button" aria-label="Mute sound" title="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><g class="sound-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g><path class="mute-slash" d="m15 9 6 6m0-6-6 6"/></svg>
    </button>
  </nav>
  <audio id="background-music" preload="auto" aria-hidden="true"></audio>
  <audio id="diary-sound" src="audio/open-diary-sound.mp3" preload="auto" aria-hidden="true"></audio>
  <audio id="key-sound" src="audio/key-stroke.mp3" preload="auto" aria-hidden="true"></audio>

<script src="sinhala-legacy.js"></script>
<script>
(() => {
  // ---------------------------------------------------------------- settings
  const CHAT_URL    = "http://localhost:8000/chat/";
  const FONT_FAMILY = '"Moon Dance", cursive';
  const graphemes = new Intl.Segmenter(undefined, { granularity: "grapheme" });
  const REPLY_FONT_SCALE = 0.7; // reply text is 70% of the writing size
  const INK         = [22, 15, 10];   // near-black iron-gall ink
  const SOAK_INK    = [96, 64, 38];   // the colour ink fades to as it sinks in

  const WET_HOLD    = 650;   // ms the written text sits "wet" before it sinks
  const ABSORB_MS   = 2000;  // ms for the ink to be drunk by the page
  const SILENCE_MS  = 800;   // ms of blank page before the diary answers
  const REPLY_SINK  = 1700;  // ms for the reply to sink when you write again

  // ---------------------------------------------------------------- elements
  const page   = document.getElementById("page");
  const canvas = document.getElementById("ink");
  const ctx    = canvas.getContext("2d");
  const ta     = document.getElementById("input");
  const hint   = document.getElementById("hint");
  const defaultHint = hint.textContent;
  const historyList = document.getElementById("history-list");
  const historyScroll = document.getElementById("history-scroll");
  const historyEmpty = document.getElementById("history-empty");
  const book = document.getElementById("book");
  const cover = document.getElementById("diary-cover");
  const diaryToggle = document.getElementById("diary-toggle");
  const openDiaryButton = document.getElementById("open-diary");
  const music = document.getElementById("background-music");
  const diarySound = document.getElementById("diary-sound");
  diarySound.volume = 0.5;
  const keySound = document.getElementById("key-sound");
  keySound.volume = 0.5;
  function playKeySound() {
    if (music.muted) return;
    // Clone so rapid keystrokes overlap instead of restarting one another.
    const s = keySound.cloneNode();
    s.volume = keySound.volume;
    s.play().catch(() => {});
  }
  const musicToggle = document.getElementById("music-toggle");
  const musicTracks = [
    "audio/geoffharvey-the-magic-tree-150606.mp3",
    "audio/hitslab-magic-mystery-harry-potter-music-320643.mp3",
    "audio/hitslab-mystery-mystery-mystical-mysterious-music-460378.mp3"
  ];
  let musicTrack = 0;
  music.volume = 0.25;
  music.src = musicTracks[musicTrack];

  function startMusic() {
    if (!music.paused) return;
    music.play().catch(() => {
      // If autoplay is blocked, retry on a click or keypress anywhere on the page.
    });
  }

  document.addEventListener("click", startMusic);
  document.addEventListener("keydown", startMusic);
  music.addEventListener("playing", () => {
    document.removeEventListener("click", startMusic);
    document.removeEventListener("keydown", startMusic);
  });

  music.addEventListener("ended", () => {
    musicTrack = (musicTrack + 1) % musicTracks.length;
    music.src = musicTracks[musicTrack];
    startMusic();
  });

  musicToggle.addEventListener("click", () => {
    music.muted = !music.muted;
    diarySound.muted = music.muted;
    musicToggle.classList.toggle("is-muted", music.muted);
    musicToggle.setAttribute("aria-pressed", String(music.muted));
    const label = music.muted ? "Unmute sound" : "Mute sound";
    musicToggle.setAttribute("aria-label", label);
    musicToggle.title = label;
    if (!music.muted) startMusic();
  });
  let diaryState = "closed";
  let transitionFallback;

  function finishDiaryTransition() {
    if (diaryState !== "opening" && diaryState !== "closing") return;
    const open = diaryState === "opening";
    diaryState = open ? "open" : "closed";
    clearTimeout(transitionFallback);
    cover.hidden = open;
    book.classList.remove("is-opening", "is-closing");
    book.classList.toggle("book-intro", !open);
    book.removeAttribute("aria-busy");
    page.inert = !open;
    document.getElementById("history-page").inert = !open;
    diaryToggle.disabled = false;
    diaryToggle.hidden = !open;
    openDiaryButton.disabled = false;
    diaryToggle.setAttribute("aria-expanded", String(open));
    openDiaryButton.setAttribute("aria-expanded", String(open));
    resize();
    (open ? ta : openDiaryButton).focus({ preventScroll: true });
  }

  function toggleDiary() {
    if (diaryState !== "closed" && diaryState !== "open") return;
    diarySound.currentTime = 0;
    diarySound.play().catch(() => {
      // Keep the diary controls working if sound playback is unavailable.
    });
    const open = diaryState === "closed";
    diaryState = open ? "opening" : "closing";
    diaryToggle.disabled = true;
    openDiaryButton.disabled = true;
    book.setAttribute("aria-busy", "true");
    page.inert = true;
    document.getElementById("history-page").inert = true;
    cover.hidden = false;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      finishDiaryTransition();
      return;
    }
    book.classList.add("book-intro", open ? "is-opening" : "is-closing");
    transitionFallback = setTimeout(finishDiaryTransition, open ? 2000 : 1500);
  }

  openDiaryButton.addEventListener("click", toggleDiary);
  diaryToggle.addEventListener("click", toggleDiary);

  cover.addEventListener("animationend", event => {
    if (event.target === cover && event.animationName === "cover-opening") finishDiaryTransition();
  });

  // History lives only in memory and starts empty on every page load.
  function appendHistoryEntry(entry) {
    const item = document.createElement("li");
    item.className = "history-entry";
    for (const [text, answer] of [
      [entry.prompt, false],
      [entry.reply, true]
    ]) {
      const paragraph = document.createElement("p");
      paragraph.className = answer ? "history-text history-answer" : "history-text history-question";
      for (const run of textRuns(text)) {
        if (!run.sinhala) {
          paragraph.append(document.createTextNode(run.source));
          continue;
        }
        const display = document.createElement("span");
        display.className = "sinhala-display";
        display.dataset.legacy = run.text;
        display.setAttribute("aria-hidden", "true");
        const original = document.createElement("span");
        original.className = "screen-reader-text";
        original.lang = "si";
        original.textContent = run.source;
        paragraph.append(display, original);
      }
      item.append(paragraph);
    }
    historyList.append(item);
  }

  // Prior turns sent to the backend, in its { role: "user" | "model", content } shape.
  const chatHistory = [];
  const maxHistoryMessages = 10; // the backend only uses the last 10

  function rememberExchange(prompt, reply) {
    const entry = { prompt, reply };
    chatHistory.push({ role: "user", content: prompt }, { role: "model", content: reply });
    appendHistoryEntry(entry);
    historyEmpty.hidden = true;
    historyScroll.scrollTo({
      top: historyScroll.scrollHeight,
      behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth"
    });
  }

  try {
    // Remove history saved by earlier versions of the diary.
    localStorage.removeItem("tom-riddle-diary-history");
  } catch {
    // Browser storage may be unavailable; in-memory history still works.
  }

  let W = 0, H = 0, dpr = 1, fontPx = 40;

  // ---------------------------------------------------------------- state
  let phase = "typing";          // typing | absorb | silence | reveal | shown
  let typed = "", times = [];    // the text being written + when each char landed
  let ink = null;                // the user's sentence, prepared for absorbing
  let replyInk = null;           // the diary's reply
  let sinkingInk = null;         // the reply sinking away while you write again
  let t0 = 0, sinkT0 = 0;
  let pendingReply = null;       // populated when the backend answers
  let pendingExchange = null;    // remembered only after the reply finishes appearing

  const clamp  = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const ease   = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
  const fontStr = (size = fontPx, family = FONT_FAMILY) => `${size}px ${family}`;

  // This supplied font uses legacy Latin code points for Sinhala glyphs.
  // Convert only Sinhala runs for display; keep canonical text in Unicode.
  function textRuns(text) {
    return text.split(/([\u0D80-\u0DFF\u200C\u200D]+)/u).filter(Boolean).map(source => {
      const sinhala = /[\u0D80-\u0DFF]/u.test(source);
      return { source, sinhala, text: sinhala ? window.sinhalaToLegacy(source) : source,
        family: sinhala ? '"Diary Sinhala", serif' : FONT_FAMILY };
    });
  }

  function measureInkText(text, size) {
    let width = 0;
    for (const run of textRuns(text)) {
      ctx.font = fontStr(size, run.family);
      width += ctx.measureText(run.text).width;
    }
    return width;
  }

  function drawInkText(c, text, x, y, size) {
    for (const run of textRuns(text)) {
      c.font = fontStr(size, run.family);
      c.fillText(run.text, x, y);
      x += c.measureText(run.text).width;
    }
  }

  // ---------------------------------------------------------------- sizing
  function resize() {
    const r = page.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width * dpr));
    H = Math.max(1, Math.round(r.height * dpr));
    canvas.width = W; canvas.height = H;
    fontPx = W * 0.09;
    // inks are pixel buffers, so rebuild them at the new size
    if (ink)        ink        = makeInk(ink.text, ink.fontScale, ink.formatted);
    if (replyInk)   replyInk   = makeInk(replyInk.text, replyInk.fontScale, replyInk.formatted);
    if (sinkingInk) sinkingInk = makeInk(sinkingInk.text, sinkingInk.fontScale, sinkingInk.formatted);
  }

  // ---------------------------------------------------------------- layout
  // Preserve paragraphs and list items while wrapping, with hanging indents
  // for numbered or bulleted items in formatted replies.
  function layout(text, size = fontPx, formatted = false) {
    ctx.font = fontStr(size);
    const maxW = W * 0.76, lines = [];
    let paragraphStart = 0;
    for (const paragraph of text.split("\n")) {
      const marker = formatted ? paragraph.match(/^\s*(?:\d+[.)]|[-*•])\s+/) : null;
      const hangingIndent = marker ? measureInkText(marker[0], size) : 0;
      let ls = paragraphStart, lastSpace = -1, indent = 0;
      const end = paragraphStart + paragraph.length;
      for (const { segment, index } of graphemes.segment(paragraph)) {
        const i = paragraphStart + index;
        if (segment === " ") lastSpace = i;
        if (i > ls && measureInkText(text.slice(ls, i + segment.length), size) > maxW - indent) {
          if (lastSpace > ls) { lines.push([ls, lastSpace, indent]); ls = lastSpace + 1; }
          else                { lines.push([ls, i, indent]); ls = i; }
          indent = hangingIndent;
          lastSpace = -1;
        }
      }
      lines.push([ls, end, indent]);
      paragraphStart = end + 1;
    }

    const lineH = size * 1.3;
    const firstBase = H * 0.43 - (lines.length * lineH) / 2 + lineH * 0.72;
    const outLines = [], chars = [];
    const leftAligned = formatted && text.includes("\n");
    lines.forEach(([s, e, indent], li) => {
      const str = text.slice(s, e);
      const w = measureInkText(str, size);
      const x0 = leftAligned ? W * 0.12 + indent : (W - w) / 2;
      const y = firstBase + li * lineH;
      outLines.push({ s, e, x0, w, y, text: str });
      for (const { segment, index } of graphemes.segment(str)) {
        const k = s + index;
        chars.push({ i: k, ch: segment, x: x0 + measureInkText(text.slice(s, k), size), y });
      }
    });
    return { lines: outLines, chars, lineH, fontPx: size };
  }

  function drawGlyphs(c, L, alphaOf, ox = 0, oy = 0, wet = false) {
    c.font = fontStr(L.fontPx);
    c.textBaseline = "alphabetic";
    c.fillStyle = `rgb(${INK})`;
    if (!alphaOf) {
      // Draw complete lines so Sinhala vowel signs and conjuncts shape together.
      for (const line of L.lines) {
        drawInkText(c, line.text, line.x0 - ox, line.y - oy, L.fontPx);
      }
      return;
    }
    if (wet) { c.shadowColor = `rgba(${INK},0.45)`; c.shadowBlur = fontPx * 0.035; }
    for (const g of L.chars) {
      const a = alphaOf ? alphaOf(g.i) : 1;
      if (a <= 0) continue;
      c.globalAlpha = a;
      drawInkText(c, g.ch, g.x - ox, g.y - oy, L.fontPx);
    }
    c.globalAlpha = 1; c.shadowBlur = 0;
  }

  // ---------------------------------------------------------------- noise
  function hash(x, y, seed) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }
  function valueNoise(out, w, h, cell, seed, weight) {
    const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
    const g = new Float32Array(gw * gh);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) g[j * gw + i] = hash(i, j, seed);
    for (let y = 0; y < h; y++) {
      const fy = y / cell, iy = fy | 0; let ty = fy - iy; ty = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < w; x++) {
        const fx = x / cell, ix = fx | 0; let tx = fx - ix; tx = tx * tx * (3 - 2 * tx);
        const a = g[iy * gw + ix], b = g[iy * gw + ix + 1];
        const c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
        out[y * w + x] += weight * (a + (b - a) * tx + (c - a) * ty + (a - b - c + d) * tx * ty);
      }
    }
  }
  // paper-fibre-like noise: big blotches + mid detail + fine grain
  function paperNoise(w, h, seed) {
    const n = new Float32Array(w * h);
    valueNoise(n, w, h, Math.max(4, fontPx * 0.24),  seed,     0.55);
    valueNoise(n, w, h, Math.max(3, fontPx * 0.09),  seed + 7, 0.30);
    valueNoise(n, w, h, Math.max(2, fontPx * 0.035), seed + 13, 0.15);
    let mn = 1e9, mx = -1e9;
    for (let i = 0; i < n.length; i++) { if (n[i] < mn) mn = n[i]; if (n[i] > mx) mx = n[i]; }
    const k = 1 / (mx - mn || 1);
    for (let i = 0; i < n.length; i++) n[i] = (n[i] - mn) * k;
    return n;
  }

  function boxBlur(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), d = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      let s = 0; const row = y * w;
      for (let x = -r; x <= r; x++) s += src[row + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[row + x] = s / d;
        s += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let y = -r; y <= r; y++) s += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = s / d;
        s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- ink buffers
  // Renders a sentence once into pixel buffers we can then "soak" or "write"
  // pixel by pixel:
  //   srcA  – the crisp letter shapes
  //   blurA – a soft version; high in the middle of strokes, low at their edges
  //   noise – paper fibres, so the ink sinks in blotches, not uniformly
  //   order – writing order (line, then left→right) used for the reply
  function makeInk(text, fontScale = 1, formatted = false) {
    let size = fontPx * fontScale;
    let L = layout(text, size, formatted);
    // Fit multi-line replies inside the writing area instead of clipping them.
    while (formatted && L.lines.length * L.lineH > H * 0.68 && size > 1) {
      size *= 0.92;
      L = layout(text, size, formatted);
    }
    const padX = size * 0.7;
    let minX = W, maxX = 0;
    for (const l of L.lines) { minX = Math.min(minX, l.x0); maxX = Math.max(maxX, l.x0 + l.w); }
    const bx = Math.floor(clamp(minX - padX, 0, W));
    const by = Math.floor(clamp(L.lines[0].y - size * 1.15, 0, H));
    const bw = Math.max(1, Math.ceil(clamp(maxX + padX, 0, W)) - bx);
    const bh = Math.max(1, Math.ceil(clamp(L.lines[L.lines.length - 1].y + size * 0.75, 0, H)) - by);

    const cv = document.createElement("canvas");
    cv.width = bw; cv.height = bh;
    const c = cv.getContext("2d");
    drawGlyphs(c, L, null, bx, by);
    const img = c.getImageData(0, 0, bw, bh).data;
    const n = bw * bh, srcA = new Float32Array(n);
    for (let i = 0; i < n; i++) srcA[i] = img[i * 4 + 3] / 255;

    const r = Math.max(1, Math.round(size * 0.045));
    let blurA = boxBlur(boxBlur(srcA, bw, bh, r), bw, bh, r);
    let mx = 0; for (let i = 0; i < n; i++) if (blurA[i] > mx) mx = blurA[i];
    if (mx > 0) for (let i = 0; i < n; i++) blurA[i] = Math.min(1, blurA[i] / mx);

    const noise = paperNoise(bw, bh, (Math.random() * 1e6) | 0);

    // find the words (in writing order) and where each sits on its line
    ctx.font = fontStr(size);
    const words = [];
    let cur = null;
    for (const g of L.chars) {
      if (g.ch === " ") { cur = null; continue; }
      const li = L.lines.findIndex(l => g.i >= l.s && g.i < l.e);
      const gw = measureInkText(g.ch, size);
      if (!cur || cur.li !== li) { cur = { li, x0: g.x, x1: g.x + gw }; words.push(cur); }
      else cur.x1 = g.x + gw;
    }
    if (!words.length) words.push({ li: 0, x0: 0, x1: W });

    // which word each pixel belongs to (nearest word on the nearest line,
    // split half-way between neighbouring words)
    const wordOf = new Uint16Array(n);
    for (let y = 0; y < bh; y++) {
      const ay = y + by;
      let li = 0, best = 1e9;
      L.lines.forEach((l, k) => { const dd = Math.abs(ay - (l.y - size * 0.3)); if (dd < best) { best = dd; li = k; } });
      const ids = [];
      words.forEach((w, k) => { if (w.li === li) ids.push(k); });
      if (!ids.length) ids.push(0);
      for (let x = 0; x < bw; x++) {
        const ax = x + bx;
        let wi = ids[0];
        for (let m = 0; m < ids.length - 1; m++) {
          const split = (words[ids[m]].x1 + words[ids[m + 1]].x0) / 2;
          if (ax > split) wi = ids[m + 1]; else break;
        }
        wordOf[y * bw + x] = wi;
      }
    }

    const out = c.createImageData(bw, bh);
    return { text, fontScale, formatted, L, bx, by, bw, bh, srcA, blurA, noise, words, wordOf, cv, c, out, rendered: false };
  }

  // ---------------------------------------------------------------- the absorb
  // The page drinks the ink: thin stroke edges go first (low blurA), in blotches
  // set by the paper fibres (noise). Meanwhile a faint halo bleeds outward into
  // the paper and the colour fades from black to a dry sepia before vanishing.
  // `soak` holds one amount per word: 0 = crisp black ink, 1 = fully sunk away.
  function renderSoak(k, soak) {
    const { srcA, blurA, noise, wordOf, out } = k, d = out.data, n = srcA.length;
    // per-word parameters, worked out once per frame
    const thr = [], halo = [], R = [], G = [], B = [];
    for (const e of soak) {
      thr.push(e * 1.25 - 0.12);
      halo.push(Math.sin(Math.PI * clamp(e * 1.15)) * 0.3);
      const cm = clamp(e * 1.1);
      R.push(INK[0] + (SOAK_INK[0] - INK[0]) * cm);
      G.push(INK[1] + (SOAK_INK[1] - INK[1]) * cm);
      B.push(INK[2] + (SOAK_INK[2] - INK[2]) * cm);
    }
    const soft = 0.14;
    for (let i = 0, j = 0; i < n; i++, j += 4) {
      const a = srcA[i], b = blurA[i];
      if (b < 0.003 && a < 0.003) { d[j + 3] = 0; continue; }
      const w = wordOf[i], t = thr[w];
      const key = 0.55 * noise[i] + 0.45 * b;
      let v = clamp((key - t) / soft); v = v * v * (3 - 2 * v);
      let alpha = a * v;
      const hv = clamp((key - t + 0.3) / 0.4);
      const h = b * halo[w] * hv;
      if (h > alpha) alpha = h;
      d[j] = R[w]; d[j + 1] = G[w]; d[j + 2] = B[w]; d[j + 3] = alpha * 255;
    }
    k.c.putImageData(out, 0, 0);
    ctx.drawImage(k.cv, k.bx, k.by);
  }

  // The user's text: every word sinks together.
  function renderAbsorb(k, e) {
    renderSoak(k, k.words.map(() => e));
  }

  // ---------------------------------------------------------------- the reply
  // Play the absorb backwards for the entire reply at once.
  function renderReveal(k, ms) {
    renderAbsorb(k, 1 - ease(clamp(ms / ABSORB_MS)));
  }

  // ---------------------------------------------------------------- typing
  function drawTyping(now) {
    if (typed.length) {
      const L = layout(typed);
      // each glyph lands quickly, like a nib touching paper
      drawGlyphs(ctx, L, i => clamp((now - times[i]) / 200), 0, 0, true);
    }
  }

  // ---------------------------------------------------------------- flow
  function busy() { return diaryState !== "open" || phase === "absorb" || phase === "silence" || phase === "reveal"; }

  async function submit() {
    if (busy() || !typed.trim()) return;
    const prompt = typed.trim();
    ink = makeInk(typed);
    typed = ""; times = []; ta.value = "";
    pendingReply = null;
    pendingExchange = null;
    ta.readOnly = true;
    phase = "absorb"; t0 = performance.now();
    hint.textContent = "The diary is answering…";
    hint.style.opacity = "1";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 120000);
    try {
      const response = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, history: chatHistory.slice(-maxHistoryMessages) }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`Chat request failed (${response.status}).`);
      const data = await response.json();
      if (typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("The diary returned an empty or invalid reply.");
      }
      if (/[\u0D80-\u0DFF]/.test(data.reply)) {
        await document.fonts.load('40px "Diary Sinhala"');
      }
      pendingReply = data.reply.trim().replace(/\r\n?/g, "\n").replace(/\t/g, "    ");
      pendingExchange = { prompt, reply: pendingReply };
    } catch (error) {
      console.error("Could not get the diary's reply:", error);
      ink = null;
      phase = "typing";
      typed = prompt; ta.value = prompt;
      times = Array.from(prompt, () => performance.now());
      ta.readOnly = false;
      hint.textContent = error.name === "AbortError"
        ? "The diary took too long. Press Enter to try again."
        : "The diary could not answer. Check the backend and press Enter to retry.";
      hint.style.opacity = "1";
      ta.focus();
    } finally {
      clearTimeout(timeout);
    }
  }

  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submit(); }
  });

  ta.addEventListener("input", () => {
    let v = ta.value, wantsSubmit = false;
    if (v.includes("\n")) { v = v.replace(/\n/g, ""); ta.value = v; wantsSubmit = true; }
    // Let the current reply finish before accepting the next question.
    if (busy()) { ta.value = typed; return; }
    if (v !== typed) playKeySound();
    const now = performance.now();
    if (phase !== "typing" && v.length) {
      // Writing again clears the completed reply.
      replyInk = null; sinkingInk = null; phase = "typing";
      hint.textContent = defaultHint;
      hint.style.opacity = "1";
    }
    let k = 0;
    while (k < typed.length && k < v.length && typed[k] === v[k]) k++;
    times = times.slice(0, k);
    for (let j = k; j < v.length; j++) times.push(now);
    typed = v;
    if (wantsSubmit) submit();
  });

  page.addEventListener("pointerdown", () => setTimeout(() => ta.focus(), 0));

  // ---------------------------------------------------------------- loop
  function frame(now) {
    ctx.clearRect(0, 0, W, H);

    if (sinkingInk) {
      const p = clamp((now - sinkT0) / REPLY_SINK);
      renderAbsorb(sinkingInk, ease(p));
      if (p >= 1) sinkingInk = null;
    }

    switch (phase) {
      case "typing":
        drawTyping(now);
        break;
      case "absorb": {
        const p = clamp((now - t0 - WET_HOLD) / ABSORB_MS);
        renderAbsorb(ink, ease(p));
        if (p >= 1) { ink = null; phase = "silence"; t0 = now; }
        break;
      }
      case "silence":
        if (now - t0 > SILENCE_MS && pendingReply !== null) {
          replyInk = makeInk(pendingReply, REPLY_FONT_SCALE, true);
          pendingReply = null;
          hint.style.opacity = "0";
          phase = "reveal"; t0 = performance.now();
        }
        break;
      case "reveal": {
        const ms = now - t0;
        renderReveal(replyInk, ms);
        if (ms >= ABSORB_MS) {
          phase = "shown";
          replyInk.rendered = true;
          ta.readOnly = false;
          if (pendingExchange) {
            rememberExchange(pendingExchange.prompt, pendingExchange.reply);
            pendingExchange = null;
          }
        }
        break;
      }
      case "shown":
        if (!replyInk.rendered) { renderReveal(replyInk, ABSORB_MS); replyInk.rendered = true; }
        else ctx.drawImage(replyInk.cv, replyInk.bx, replyInk.by);
        break;
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- start
  startMusic();
  window.addEventListener("resize", resize);
  const start = () => { resize(); requestAnimationFrame(frame); };
  Promise.race([
    Promise.all([
      document.fonts.load('40px "Moon Dance"'),
      document.fonts.load('40px "Diary Sinhala"')
    ]),
    new Promise(r => setTimeout(r, 3000))
  ]).then(start, start);
})();
</script>
</body>
</html>
